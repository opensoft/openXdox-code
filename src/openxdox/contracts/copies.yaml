# as T007's batch I amends it; R1Q14 (a) and R1Q27 (a), opensoft/openxFactory#656
# comments 5850003126 and 5851950767).
#
# WHAT IT SAYS. Each schema under `schemas/` beside this file is, byte for byte,
# the file its `path` names in `spec_leg` at `commit`, and `sha256` is that
# file's digest. These are the consumer validator's own three kinds (7.1's
# openXdox-spec three). The validator reads them from the installed
# distribution, and recomputes each digest against this record before it reads
# a copy: a copy that differs, one that is absent, and one whose digest is left
# empty are all refused (`openxdox.contracts.verified_path`, and the same check
# inside `validate-ideation-dashboard-contracts.py`).
#
# WHERE THE VALUES CAME FROM, read with `git show <commit>:<path> | sha256sum`
# in opensoft/openXdox-spec.
#
# * `commit` is the spec-leg commit the openXdox root pins: its `spec` gitlink
#   and `contracts/spec-pin.yaml` name f088b097 at opensoft/openXdox `main`
#   57e2b8f2. It is the one commit all three copies were taken at.
# * Each digest is the one the root's `contracts/manifest.yaml` records for that
#   file at that commit.
#
# NEVER EDIT A COPY OR A DIGEST IN PLACE. openXdox-spec owns these schemas
# (R1Q12 (a)). A copy changes in the spec leg. It arrives here when the spec
# leg's file is copied at the pinned commit and its digest recorded, in one
# commit, with `commit` moved to the spec pin that carries it.
#
# A CREATED file: no row in openxFactory's `docs/opendox-carve-manifest.yaml`
# (RULED OQ-C).
