name: validate

# The required check for this leg: parity with the assembly root's own
# `validate` gate (same name, same triggers). Since plan 034 task T043 it runs
# the leg's whole pytest suite, less its declared exclusion and the one test
# the `pytest` step deselects until T008, both named at that step.
#
# Levelled against openDox-code by the OQ-O scaffold-levelling pass
# (openxFactory#656): same pinned pytest major, same least-privilege
# `permissions:` block.
#
# READ THE HEAD, NOT THE ROLLUP, AND THIS IS NOT A GENERAL CAUTION — it is a
# thing that happened on the pull request that added the last two entries of
# the sixteen-file list this job ran until plan 034 T043, twice.
# `on: pull_request` does not fire for a push made with
# a GitHub App token, which is what `copilot-swe-agent[bot]` pushes with when a
# review is requested on a PR. So a head whose last commit is the bot's can
# report an aggregate status of SUCCESS while THIS CHECK, the required one,
# never ran on it at all — the rollup is green because the advisory checks that
# do fire (SonarCloud) passed, and the missing one is invisible unless you list
# the contexts:
#
#   gh api graphql ... statusCheckRollup { state contexts { ... } }
#     head a120b79d   rollup SUCCESS
#       SonarCloud Code Analysis: SUCCESS      <- advisory
#       (validate absent)                      <- REQUIRED, never ran
#
# The remedy is a commit of your own on top, which is a real push and does
# trigger it. Merging a head in that state is merging something this gate has
# not measured.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # INSTALL THE PACKAGE AND ITS TEST EXTRA, levelling round 2
      # (opensoft/openxFactory#656, "HEADS-UP for LEG 3" item 1; Brett Heap,
      # 2026-09-10: "merge openXdox-code levelling round 2 when green"). This
      # step was `pip install "pytest>=8,<9"` and nothing else, which is
      # exactly the gap that made openDox-code's own first carved commit fail
      # its required check with `No module named 'yaml'` before ITS round 2
      # landed: the runner was there and the package's own dependencies never
      # were. `-e .[test]` installs both from `pyproject.toml` — the `opendox`
      # git dependency and PyYAML, plus the test runner — so the pytest range
      # round 1 chose, `pytest>=8,<9`, unchanged, is declared once, in the
      # `test` extra, and read from here rather than copied here.
      - name: install the package and its test extra
        run: python -m pip install -e ".[test]"

      # THE WHOLE SUITE, LESS THE DECLARED EXCLUSION: plan 034 task T043
      # (openxFactory `specs/034-opendox-standalone-operation/`), box 9.2 of
      # the ratified `add-neutral-product-standalone-operability`. 9.2 asks
      # for "openXdox-code the same" as 9.1, whose required check runs the
      # whole suite with no file list and without pytest's no-conftest flag.
      # Requirement 9's first scenario lets a check run less than the suite
      # in the tree only when "the difference is declared with its count and
      # its reason, and it is reported as an open extraction". For release 1
      # the rulings admit that difference here: R1Q6 (d) (openxFactory#656
      # comment 5817152735) for `doc_health`, and R1Q24 (a) and R1Q25 (b)
      # (comment 5850003126) for openxFactory's status-exemption rail, its
      # contracts, and the consumer's schemas.
      #
      # WHAT THIS STEP RUNS. `python -m pytest -q` from the checkout root,
      # with the conftest chain in play and no path. So pytest reads
      # `testpaths = ["tests"]` from `pyproject.toml` and collects `tests/`
      # whole, `tests/integration/` (9.3, plan 034 T042) included. The root
      # `conftest.py` (T041) derives `collect_ignore` from
      # `tests/declared_exclusion.yaml`, so the run collects every other test
      # file. At its end the run prints that declaration as an OPEN
      # extraction: the count, each reason with its ruling and what it waits
      # for, and each file with its reasons. A declaration that breaks one of
      # its own rules refuses the run at collection, naming the rule.
      # `tests/test_declared_exclusion.py` runs inside this suite. It holds
      # each listed file to its entry: run alone, the file fails, and it fails
      # only for the reasons its entry names. So the declaration cannot hide
      # a failure of any other kind, and a file that stops failing for its
      # reason turns that check red until the file leaves the list.
      #
      # THIS FILE NAMES NONE OF THE DECLARED FILES. A second list here would
      # be one more copy to keep in step with the declaration, and the two
      # would drift. The declaration is the list, and the run prints it.
      # Requirement 9 is met for this leg only once the declaration is empty.
      # Its `doc_health`, rail and contracts entries wait for the doc_health
      # direction arc (plan 034 T008), and its consumer-schemas entry waits
      # for 7.3 (T061, in phase 2). So the extraction stays open until then,
      # and T097 ticks 9.2 with that note.
      #
      # ONE TEST IS LEFT OUT BESIDE THEM, WITH ITS STATED REASON, UNTIL T008:
      # `LEFT_OUT` below, the 31-entry assembled `--help` tree. RULED
      # openxFactory#656 comment 5859927858 (Brett Heap, 2026-09-27, "(b)
      # Exclude it until T008's arc"): "The test leaves T042's integration
      # step, with its stated reason: cli_gate imports openxFactory's
      # doc_health at load time, which is R1Q6 (d)'s kind of exclusion. It
      # runs again once the doc_health direction arc (T008) lands. F9.2 is
      # unchanged." T042 carried that out in its own `integration (9.3)` step.
      # This step replaces that one, so the exclusion comes with it,
      # unchanged:
      #   * It is LEFT OUT, not skipped: `--deselect` takes it out before it
      #     runs, so no report counts it, and the exact skip pin below is
      #     untouched.
      #   * The step prints it as an open extraction, with its reason, on the
      #     run's own page (the `::notice::` line).
      #   * F9.2 is unchanged, so F9.2 still runs it, by name, and stays red
      #     on it until T008.
      #   * `test_the_help_tree_is_left_out_only_while_its_stated_reason_holds`,
      #     beside it in `tests/integration/test_assembled_surface.py`, runs in
      #     this step and passes only while the reason holds. Once the arc
      #     lands it fails, so the pull request that clears the reason takes
      #     `LEFT_OUT` out of this step, and that test with it.
      #   * T041's declaration lists whole `tests/test_*.py` files directly in
      #     `tests/`, so it cannot carry one test in `tests/integration/`. That
      #     is why this one exclusion is stated here and not there.
      #
      # WHAT THIS STEP REPLACED. Until T043 the required check named sixteen
      # test files and switched the conftest chain off, under RULED Q-L8 (b′)
      # (openxFactory#656, 2026-09-10), as § 3.4 slice S8 and the acts after
      # it un-narrowed that list; T042 added a second step for
      # `tests/integration/`. The chain was off because `tests/conftest.py`
      # imported carved session fixtures that reached `ideation_dashboard` and
      # `doc_health`, two packages neither leg carries. At the openDox this
      # leg now pins (openDox-code `2d116415`, since plan 034 T040), the chain
      # loads in a lone checkout, and what still reaches openxFactory is what
      # the declaration and `LEFT_OUT` hold. Each of the sixteen files'
      # account of itself (why it joined the list, its counts, its review
      # rounds) is in this file's history at `d84b5048`
      # (`git show d84b5048:.github/workflows/validate.yml`), and is not
      # repeated here: every one of the sixteen runs in this step now. So do
      # the files the list left off although they were green, among them
      # `tests/test_aggregation_register_instance.py`, whose four skips are in
      # the pin below. The two files earlier acts kept off the list for the
      # BUILD arc's defect are declared now: `tests/test_doxbench_turns.py`
      # under the rail, and `tests/test_doxbench_mutation_boundary.py` under
      # `doc_health` (RULED openxFactory#656 comment 5700475319: "it returns
      # with the BUILD arc beside test_doxbench_turns.py"). Each leaves the
      # declaration when its reason is cleared.
      #
      # F9.1 (openXdox-code) reads this file. Its `grep -c` for pytest's
      # no-conftest flag must print 0, and it counts comments, so the flag is
      # not written anywhere here. No pytest step may name a test file outside
      # a comment, so none does.
      - name: pytest
        env:
          LEFT_OUT: tests/integration/test_assembled_surface.py::test_the_assembled_help_tree_is_the_31_entry_tree_the_manifest_records
        run: |
          echo "::notice::open extraction, left out of this run until the doc_health direction arc (plan 034 T008): $LEFT_OUT. Its stated reason: cli_gate imports openxFactory's doc_health at load time, which is R1Q6 (d)'s kind of exclusion (RULED openxFactory#656 comment 5859927858). F9.2 still runs it."
          python -m pytest -q --junitxml=pytest-report.xml --deselect "$LEFT_OUT"

      # -----------------------------------------------------------------------
      # THE PINNED TRIPLE — `split-opendox-two-layer-product` § 5.4 FLOOR
      # PART 2, clause (d), THIS LEG'S HALF.
      #
      # The clause, verbatim (openxFactory `openspec/changes/
      # split-opendox-two-layer-product/tasks.md:2768-2775`):
      #
      #   "(d) PINNED BY TEST at each destination and in `openxFactory` ...
      #    the way `pytest-suite.yml` already pins this repository's
      #    collection triple - SKIPPED exactly, SELECTED and PASSED as
      #    FLOORS, failures and errors zero. Per destination, never as one
      #    cross-repository equality."
      #
      # So this is openXdox-code's OWN triple. The openDox leg has its own
      # pin in its own file (openDox-code#29 -> 373b05aa); neither can move
      # the other, and clause (d) says why a sum was rejected.
      #
      # ONE REPORT AGAIN, since plan 034 T043. T042 had this step sum two
      # reports, the named list's and the integration directory's, the shape
      # openDox-code's own required job had until its T036. The whole-suite
      # step writes one report, `pytest-report.xml`, and the integration
      # directory is inside it. A report that did not appear is still a
      # refusal, not a smaller sum.
      #
      # WHAT IS PINNED IS WHAT THIS JOB COLLECTS: the whole suite under
      # `tests/`, less the declared exclusion and the one test the step
      # leaves out (both above). Until T043 it was a sixteen-file list, and
      # from T042 one directory beside it. Those numbers are the history
      # below.
      #
      # SO WHAT MOVES THESE NUMBERS IS A TEST ADDED OR REMOVED UNDER `tests/`,
      # OR A CHANGE TO WHAT THE DECLARATION OR `LEFT_OUT` LEAVES OUT, and
      # nothing else.
      #   * A test added, or a declared file that leaves the declaration
      #     because its reason is cleared, RAISES SELECTED and PASSED. Floors
      #     permit a rise, and the commit that makes it should raise them WITH
      #     the reason, so the margin keeps meaning something.
      #   * A test removed, or a file that JOINS the declaration, LOWERS them,
      #     and the floor refuses. A file joins only on a ruling that admits
      #     its reason, and the act that adds it re-pins these floors in the
      #     same commit, with the reason. Plan 034 T044 was such an act: the
      #     file its six skips moved into joined the declaration and lowered
      #     SELECTED, as its paragraph below records. Anything else that
      #     lowers them is tests that stopped being collected: find them, do
      #     not lower the floor.
      #
      # THE NUMBERS ARE CI'S OWN. Measured on run 35399041710 (PR #25,
      # 2026-09-18), the first commit of that pull request having printed
      # them before this step pinned them: selected 539, passed 533, skipped
      # 6, failures 0, errors 0. The reference implementation gives the
      # reason to prefer CI over a developer machine ("THE PIN IS TAKEN FROM
      # CI'S OWN RUN"): self-skip guards resolve differently on a runner.
      #
      # RAISED BY #26 (the DISPLAY facet, RULED openxFactory#656 comment
      # 5784683830), the same way: run 35799110856 (2026-09-22) measured
      # `9ef72921`, the head before this change, at selected 559, passed 553,
      # skipped 6, failures 0, errors 0. The +20 on both floors is the twenty
      # tests the facet adds to `tests/test_gate_loop_views.py`, the only file
      # on the list whose count moved (54 -> 74). Skipped is unchanged,
      # because none of them skips.
      #
      # RAISED BY #27 (the completion stage's item nouns, RULED openxFactory#656
      # comment 5801057769), the same way: run 35913645237 (2026-09-23)
      # measured `d3b179a4`, the head before this change, at selected 564,
      # passed 558, skipped 6, failures 0, errors 0. The +5 on both floors is
      # the five wheel-sentence probes it adds to
      # `tests/test_gate_loop_probes.py`, the only file on the list whose count
      # moved (50 -> 55); the six `tests/test_gate_loop_views.py` cases it
      # amends leave that file at 74. Skipped is unchanged, because none of
      # them skips on a runner with node, which this one is.
      #
      # RAISED BY #31 (plan 034 T042, box 9.3: `tests/integration/`), the same
      # way: run 36355557215 (2026-09-27) measured `4ae1c5c4`, the head before
      # this change, at openDox-code `2d116415`: selected 574, passed 568,
      # skipped 6, failures 0, errors 0. The +10 on both floors is the ten
      # tests the `integration (9.3)` step runs, which is the second report
      # this triple now sums. The named list is unchanged at 564/558/6.
      # Skipped is unchanged, because nothing in `tests/integration/` skips,
      # and the one test that step leaves out until T008 is deselected, which
      # no report counts.
      #
      # RE-PINNED BY plan 034 T043 (box 9.2: the whole suite, less the
      # declared exclusion), the same way: run 36356408029 (2026-09-27)
      # measured `890a4809`, the head before this change, at openDox-code
      # `2d116415`: selected 890, passed 880, skipped 10, failures 0, errors 0.
      # The floors RISE from 574 and 568, because this job now collects every
      # test file the declaration does not list: the sixteen the list named
      # (564 tests, unchanged), `tests/integration/` (10, with the one test the
      # step leaves out deselected), and the eight other files under `tests/`
      # that the list never ran (316). EXPECT_SKIPPED moves from 6 to 10, WITH
      # the reason: the four new skips are
      # `tests/test_aggregation_register_instance.py`'s, one of those eight,
      # and the six are unchanged. The margin is zero, as #25 set it, and
      # restoring it is plan 034 T044's (9.4, this leg's half).
      #
      # RE-PINNED BY plan 034 T044 (box 9.4, this leg's half: "Restore the
      # margin, and stop the skips carrying the gap"): selected 885, passed
      # 881, skipped 4, failures 0, errors 0, the reading of this change's
      # whole suite at openDox-code `2d116415`. The six skips that carried the
      # gap were the three seam suites' `doc_health` pairs. T044 made each of
      # them assert for real and moved the six into
      # `tests/test_seam_assembly_beside_gate_and_projection.py`, which the
      # declaration lists under `doc_health` (R1Q6 (d)), so SELECTED and
      # SKIPPED each lose those six. The declaration's own check gains one
      # case, that file run alone, which passes, so SELECTED and PASSED each
      # gain one. SELECTED goes 890 -> 885, PASSED 880 -> 881 and SKIPPED
      # 10 -> 4. The 24 seam cases that need neither column stay where they
      # were, and pass. The floors sit ON the reading, as #25 set them and as
      # 9.4 and T044's text read (the holder's decision for this leg, where
      # openDox-code's T037 set its own floors three below). So the margin
      # this step prints stays zero. What 9.4 asks to restore is that no skip
      # in this pin carries the gap, and none now does: the four skips left
      # are named below, and none of them waits for `doc_health`.
      #
      # THE SKIPS ARE NAMED, which is why the exact pin is safe to take. All
      # FOUR are `tests/test_aggregation_register_instance.py`'s, which the
      # sixteen-file list never ran: each skips because the "aggregation
      # checkout (seed register + pinned validator) [is] not reachable", which
      # is every lone checkout's state. Until plan 034 T044 there were SIX
      # more, the three seam suites' `doc_health` pairs, which this file had
      # always named and 9.4 asks about. Each said that "doc_health
      # reachability is BUILD-arc work (§ 3.5/3.6) ... this test will assert
      # for real once that lands". T044 made each assert for real, and moved
      # them from `tests/test_evidence_provenance_surface_seam.py`,
      # `tests/test_model_scenario_workbench_seam.py` and
      # `tests/test_role_authority_projection_seam.py` into
      # `tests/test_seam_assembly_beside_gate_and_projection.py`, which the
      # declaration lists under `doc_health`. So none of them is a skip any
      # more, and none is in these numbers. None comes from
      # `tests/integration/`, where nothing skips (its rule 2). If the count
      # moves, move the pin WITH the reason — never relax the comparison.
      # SKIPPED is `==` where the other two are `>=` because a file that
      # quietly turns into skips is exactly what an exact pin catches and a
      # floor structurally cannot: the floor only looks down.
      - name: Pin the triple
        shell: bash
        env:
          # FLOORS - may only RISE, and only with the reason in the commit
          # message, except in the act that joins a file to the declaration
          # on a ruling, which lowers them with its reason (above). Set to
          # the measured values, which this suite has actually met on CI
          # rather than an aspiration.
          MIN_SELECTED: "885"
          MIN_PASSED: "881"
          # EXACT - the load-bearing number.
          EXPECT_SKIPPED: "4"
        run: |
          python3 - <<'PY' > triple.env
          import xml.etree.ElementTree as ET, pathlib
          REPORTS = ("pytest-report.xml",)
          tot = {"tests": 0, "skipped": 0, "failures": 0, "errors": 0}
          missing = []
          for name in REPORTS:
              f = pathlib.Path(name)
              if not f.exists():
                  missing.append(name)
                  continue
              root = ET.parse(f).getroot()
              suites = root.iter("testsuite") if root.tag == "testsuites" else [root]
              for ts in suites:
                  for k in tot:
                      tot[k] += int(ts.get(k, 0))
          if missing:
              # A REPORT THAT DID NOT APPEAR IS A REFUSAL, NOT A SMALLER SUM.
              # A pytest step that died before writing XML would otherwise
              # take its tests out of every number below in silence.
              print("MISSING=" + ",".join(missing))
          print(f"SELECTED={tot['tests']}")
          print(f"SKIPPED={tot['skipped']}")
          print(f"FAILURES={tot['failures']}")
          print(f"ERRORS={tot['errors']}")
          print(f"PASSED={tot['tests'] - tot['skipped'] - tot['failures'] - tot['errors']}")
          PY
          . ./triple.env
          echo "triple: selected=$SELECTED passed=$PASSED skipped=$SKIPPED failures=$FAILURES errors=$ERRORS"
          echo "pins:   selected>=$MIN_SELECTED (margin $((SELECTED - MIN_SELECTED))) passed>=$MIN_PASSED (margin $((PASSED - MIN_PASSED))) skipped==$EXPECT_SKIPPED"
          rc=0
          [ -z "${MISSING:-}" ] || { echo "::error::JUnit report(s) missing: $MISSING — a report that did not appear is a refusal, not a smaller sum. A step that failed to write one has taken its tests out of every number below"; rc=1; }
          [ "$SELECTED" -ge "$MIN_SELECTED" ] || { echo "::error::selected $SELECTED is BELOW the floor $MIN_SELECTED — tests stopped being collected. Find them; do not lower the floor"; rc=1; }
          [ "$PASSED" -ge "$MIN_PASSED" ] || { echo "::error::passed $PASSED is BELOW the floor $MIN_PASSED — find the tests that stopped passing or stopped being collected; do not lower the floor"; rc=1; }
          [ "$SKIPPED" = "$EXPECT_SKIPPED" ] || { echo "::error::skipped $SKIPPED, pinned exactly $EXPECT_SKIPPED — a file that silently turned into skips is exactly what this pin exists to catch. The expected skips are the aggregation-register suite's four, named above this step. If the change is intended, move the pin WITH the reason"; rc=1; }
          [ "$FAILURES" = "0" ] || { echo "::error::failures $FAILURES, clause (d) requires zero"; rc=1; }
          [ "$ERRORS" = "0" ] || { echo "::error::errors $ERRORS, clause (d) requires zero"; rc=1; }
          exit $rc
