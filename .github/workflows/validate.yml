name: validate

# The required check for this leg: parity with the assembly root's own
# `validate` gate (same name, same triggers) — a pytest suite proving the leg
# shape.
#
# Levelled against openDox-code by the OQ-O scaffold-levelling pass
# (openxFactory#656): same pinned pytest major, same least-privilege
# `permissions:` block.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # INSTALL THE PACKAGE AND ITS TEST EXTRA, levelling round 2
      # (opensoft/openxFactory#656, "HEADS-UP for LEG 3" item 1; Brett Heap,
      # 2026-09-10: "merge openXdox-code levelling round 2 when green"). This
      # step was `pip install "pytest>=8,<9"` and nothing else, which is
      # exactly the gap that made openDox-code's own first carved commit fail
      # its required check with `No module named 'yaml'` before ITS round 2
      # landed: the runner was there and the package's own dependencies never
      # were. `-e .[test]` installs both from `pyproject.toml` — the `opendox`
      # git dependency and PyYAML, plus the test runner — so the pytest range
      # round 1 chose, `pytest>=8,<9`, unchanged, is declared once, in the
      # `test` extra, and read from here rather than copied here.
      - name: install the package and its test extra
        run: python -m pip install -e ".[test]"

      # RULED Q-L8 (b′), opensoft/openxFactory#656, 2026-09-10: until the
      # BUILD arc (split-opendox § 3.5/3.6) inverts the cross-column
      # dependencies and the remaining reaches are declared, validate runs
      # only the scaffold's shape assertions; the carved tests arrive
      # byte-identical and return to this workflow when the BUILD arc lands.
      # The same disclosed narrowing openDox-code carries under RULED Q-L5
      # (b′).
      #
      # `tests/test_dependency_direction.py` joins it under
      # `split-opendox-two-layer-product` § 4.1 (RULED 5626260214,
      # opensoft/openxFactory#656). It is a SHAPE assertion authored HERE, of
      # the same class as `test_leg_shape.py` — it parses trees, it does not
      # import the carved modules — so it does NOT un-narrow Q-L8 (b′): the
      # carved suites stay out until the BUILD arc makes them runnable.
      # `tests/test_domain_profile.py` and
      # `tests/test_no_hardcoded_status_words.py` join them under
      # `split-opendox-two-layer-product` § 4.4 (RULING C2; ASK-4 RULED
      # `openxFactory#656` comment `5634195861`), on exactly the grounds
      # `test_dependency_direction.py` joined under § 4.1. Both are SHAPE
      # assertions authored HERE: the guard PARSES `gate_console.py` and
      # `generator.py` with `ast` and never imports them, and the profile suite
      # imports `openxdox.domain_profile` alone — `yaml` and the standard
      # library, no `doc_health`, no carved module. So they do NOT un-narrow
      # RULED Q-L8 (b'): the carved suites stay out until the BUILD arc makes
      # them runnable.
      #
      # The guard is the reason § 4.4 is a fix rather than a cleanup. "A
      # hardcoded status word is a defect under `domain-mapping-declaration`"
      # (tasks.md § 4.4), and the literals it removes were the OBVIOUS way to
      # write the code when the engine and its one domain lived in the same
      # repository — they will be the obvious way again the next time someone
      # adds a status-bearing step. A defect class that recurs by default needs
      # a required check, not a commit message.
      # `split-opendox-two-layer-product` § 3.4 SLICE S5 adds
      # `tests/test_gate_loop_views.py` on exactly the footing its four
      # neighbours stand on. S5 is "contribute the gate loop" (openDox-spec
      # `docs/front-end-package-boundary.md` § 5 row S5 @ `7d12428c`), and this
      # leg's half of it is the six class-B modules arriving as PACKAGE DATA,
      # the six `ViewBinding` specs that declare them, the assembly hook that
      # places the bytes into openDox's one `--web-dir` and the hosted GET
      # fallback — RULED Q1-Q12 (openxFactory#656 comments 5648044785 /
      # 5648049748 / 5648065587, Brett Heap, 2026-09-12).
      #
      # It is the only place this column's contract is EXECUTED rather than
      # described: that every declared export is really exported, that every
      # entry takes the one RULED mount signature, that the dispose binding's
      # four computed verbs are literals now, that the hosted fallback claims
      # six EXACT paths and never a `/views/` prefix that would intercept
      # openDox's own modules, and that this column's reach into openDox's
      # bundle is exactly what it declares.
      #
      # `--noconftest` safe and needs no consumer: it imports this package's own
      # modules and reads this package's own files as text. Its three
      # materialization assertions SKIP — never fail — where the pinned
      # `opendox` predates the view contract, which is this leg's state until
      # the pin bump that lands with the openDox half.
      #
      # `tests/test_gate_loop_probes.py` joins it on the same footing and for
      # the reason the slice exists: slice S4 proved its two new modules by
      # DRIVING them under node, and those modules are this package's data now,
      # so the five probes came with them (openDox-code#20 drops them from
      # `tests/test_split_route_tails.py` in the same slice). Deleting
      # behavioural coverage in a refactor is how a move that passes every shape
      # assertion silently breaks a verb. Each probe assembles a COMPOSED bundle
      # — openDox's own `web/` with this column's six modules placed into it by
      # `web_assets.install_view_modules()`, RULED Q5's own hook — so what is
      # measured is the shipped byte in the shipped position. Where the
      # installed `opendox` carries no bundle (this leg's pinned state until the
      # pin bump) every probe SKIPS with that reason named, and where `node` is
      # absent they skip for that one.
      # § 3.4 SLICE S8 UN-NARROWS THIS LIST AS FAR AS THE MEASUREMENT ALLOWS,
      # which is the half of RULED Q-L8 (b′) this slice was scoped to lift.
      # The note's § 5 S8 row says the narrowings "lift FOR THE WEB SUITES", and
      # § 1.2(d) is why: 23 carved suites at THIS leg name a `views/<name>.js`
      # path and resolve it under `REPO_ROOT / "src" / "openxdox" / "web"` — a
      # directory this leg does not have — so "nothing runs them" here. S8
      # re-points 46 sites across 31 files at the PINNED openDox bundle
      # (`tests/opendox_bundle.py`, slice S5's own `_opendox_bundle()` shape) and
      # repairs three PRE-CARVE `scripts/ideation_dashboard/<module>.py` reads.
      # NINE SUITES JOIN THE SIX: 154 passed / 16 skipped becomes 301 passed /
      # 23 skipped, measured file-by-file under this exact invocation before
      # each was named (openXdox-code `build/s8-shed-web-tests`, 2026-09-13,
      # python 3.12.3 / pytest 8.4.2):
      #
      #   tests/test_doxbench_abstract_store.py        1 failed  -> 35 passed
      #   tests/test_doxbench_telemetry.py             1 failed  -> 18 passed
      #       both a pre-carve `MODULE_PATH`; the module under test is
      #       openDox's and is read through the PIN, as the bundle now is.
      #   tests/test_doxbench_mutation_boundary.py   1 error     ->  1 skipped
      #       A WEB SUITE, and the one of the 23 that can be named today: it
      #       reads only bundle files, so with the path repaired it COLLECTS
      #       and skips on the stated reason (this leg's `opendox` pin predates
      #       openDox's `web/**` package-data declaration) instead of erroring
      #       on a directory that does not exist. That it collects at all is
      #       § 1.2(d)'s defect closed; the pin bump is what makes it run.
      #   tests/test_evidence_provenance_surface.py         19 passed
      #   tests/test_evidence_provenance_surface_seam.py     8 passed 2 skipped
      #   tests/test_model_scenario_workbench.py            23 passed
      #   tests/test_model_scenario_workbench_seam.py       10 passed 2 skipped
      #   tests/test_role_authority_projection.py           28 passed
      #   tests/test_role_authority_projection_seam.py       6 passed 2 skipped
      #       carved suites that were already green under this invocation and
      #       had no reason left to sit outside the required check.
      #
      # WHAT THIS LIST STILL IS NOT: `python -m pytest -q` over the tree, and
      # the blocker is measured rather than asserted. THIRTY-SEVEN of this
      # leg's 88 test files fail COLLECTION on one of two openxFactory-only
      # packages present at neither leg — 21 on `ideation_dashboard`, 16 on
      # `doc_health`, the latter reached from `src/openxdox/generator.py:66`'s
      # `from doc_health import corpus` — and past collection the same two
      # reappear inside the PINNED openDox (`opendox/doxbench_packet.py:177`,
      # `import ideation_dashboard.doxbench_status_exemption`). That is the
      # BUILD arc's (split-opendox § 3.5/3.6), which RULED Q-L8 (b′)'s own
      # sentence at the head of this block names as what the rest of the
      # narrowing waits on. `tests/test_doxbench_turns.py` is the file that
      # shows it cleanly: S8's repairs take it from 37 failed / 146 passed to
      # 202 passed / 32 failed / 3 skipped, and every one of the 32 is that
      # single import. It is NOT named below, because naming it would put the
      # required check red for the BUILD arc's defect.
      #
      # `tests/test_aggregation_register_instance.py` is green and also not
      # named: it is all-skip today, on the same footing openDox-code#23 left
      # its two all-skip suites off ITS list.
      #
      # `--noconftest` STAYS, and it is why this list is a list: `tests/
      # conftest.py` imports the carved session fixtures, which reach both
      # absent packages. Every file named here stands on its own under it.
      - name: pytest
        run: >-
          python -m pytest -q
          tests/test_leg_shape.py
          tests/test_dependency_direction.py
          tests/test_domain_profile.py
          tests/test_no_hardcoded_status_words.py
          tests/test_gate_loop_views.py
          tests/test_gate_loop_probes.py
          tests/test_doxbench_abstract_store.py
          tests/test_doxbench_mutation_boundary.py
          tests/test_doxbench_telemetry.py
          tests/test_evidence_provenance_surface.py
          tests/test_evidence_provenance_surface_seam.py
          tests/test_model_scenario_workbench.py
          tests/test_model_scenario_workbench_seam.py
          tests/test_role_authority_projection.py
          tests/test_role_authority_projection_seam.py
          --noconftest
