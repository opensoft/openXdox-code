name: validate

# The required check for this leg: parity with the assembly root's own
# `validate` gate (same name, same triggers) — a pytest suite proving the leg
# shape.
#
# Levelled against openDox-code by the OQ-O scaffold-levelling pass
# (openxFactory#656): same pinned pytest major, same least-privilege
# `permissions:` block.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # INSTALL THE PACKAGE AND ITS TEST EXTRA, levelling round 2
      # (opensoft/openxFactory#656, "HEADS-UP for LEG 3" item 1; Brett Heap,
      # 2026-09-10: "merge openXdox-code levelling round 2 when green"). This
      # step was `pip install "pytest>=8,<9"` and nothing else, which is
      # exactly the gap that made openDox-code's own first carved commit fail
      # its required check with `No module named 'yaml'` before ITS round 2
      # landed: the runner was there and the package's own dependencies never
      # were. `-e .[test]` installs both from `pyproject.toml` — the `opendox`
      # git dependency and PyYAML, plus the test runner — so the pytest range
      # round 1 chose, `pytest>=8,<9`, unchanged, is declared once, in the
      # `test` extra, and read from here rather than copied here.
      - name: install the package and its test extra
        run: python -m pip install -e ".[test]"

      # RULED Q-L8 (b′), opensoft/openxFactory#656, 2026-09-10: until the
      # BUILD arc (split-opendox § 3.5/3.6) inverts the cross-column
      # dependencies and the remaining reaches are declared, validate runs
      # only the scaffold's shape assertions; the carved tests arrive
      # byte-identical and return to this workflow when the BUILD arc lands.
      # The same disclosed narrowing openDox-code carries under RULED Q-L5
      # (b′).
      #
      # THAT PARAGRAPH IS THE 2026-09-10 STATE AND IS NO LONGER THE WHOLE SCOPE
      # OF THIS CHECK. Copilot's review of `399e2a9` on openXdox-code#21 was
      # right that a reader who stopped there would take the required job to be
      # narrower than the list at the bottom of this file actually is; the
      # correction was already in the file, twenty lines further down
      # ("§ 3.4 SLICE S8 UN-NARROWS THIS LIST AS FAR AS THE MEASUREMENT
      # ALLOWS"), and had never been pointed at from up here. MEASURED against
      # that list rather than asserted — it names FOURTEEN files:
      #   * THREE never import anything under test (`test_leg_shape.py`,
      #     `test_dependency_direction.py`, `test_no_hardcoded_status_words.py`
      #     parse trees with `ast`). Those are the scaffold shape assertions the
      #     paragraph above is about, and they are all that "only the scaffold's
      #     shape assertions" ever described.
      #   * ELEVEN import a runtime module. `test_domain_profile.py` imports
      #     `openxdox.domain_profile` alone, on the § 4.4 grounds set out below;
      #     the other TEN are carved suites that RUN here, and FOUR of them reach
      #     the PINNED openDox — in TWO DIFFERENT WAYS, which this line ran
      #     together until the review of `24cd5f2` on #21 measured them apart:
      #       - TWO read the pinned WEB BUNDLE through `tests/opendox_bundle.py`
      #         (`test_gate_loop_views.py`, `test_gate_loop_probes.py`), so the
      #         provenance guard below decides what a missing bundle costs them;
      #       - TWO import pinned openDox PYTHON MODULES directly and never touch
      #         that helper: `test_doxbench_abstract_store.py:43,45`
      #         (`from opendox import doxbench_abstract_store`, `doxbench_turns`)
      #         and `test_doxbench_telemetry.py:21` (`from opendox import
      #         doxbench_telemetry`). A regression in the pin reaches those two as
      #         an ImportError or a failing assertion — loudly, and with no guard
      #         in the path to classify it.
      #     `test_gate_loop_views.py` does both (it imports
      #     `opendox.view_extension` through its own guarded helper). Measured
      #     over the fourteen files named below, not asserted:
      #       grep -ln 'import opendox_bundle' <the 14>  -> views, probes
      #       grep -ln 'from opendox import'   <the 14>  -> views, telemetry,
      #                                                     abstract_store
      # What Q-L8 (b′) still keeps out is the REST of the carved corpus, which
      # is BUILD-blocked on `doc_health` / `ideation_dashboard` — and
      # `tests/test_doxbench_mutation_boundary.py` is the one file this act
      # moves from the running group into that one, for the reason recorded in
      # the drop block below.
      #
      # `tests/test_dependency_direction.py` joins it under
      # `split-opendox-two-layer-product` § 4.1 (RULED 5626260214,
      # opensoft/openxFactory#656). It is a SHAPE assertion authored HERE, of
      # the same class as `test_leg_shape.py` — it parses trees, it does not
      # import the carved modules — so it does NOT un-narrow Q-L8 (b′): the
      # carved suites stay out until the BUILD arc makes them runnable.
      # `tests/test_domain_profile.py` and
      # `tests/test_no_hardcoded_status_words.py` join them under
      # `split-opendox-two-layer-product` § 4.4 (RULING C2; ASK-4 RULED
      # `openxFactory#656` comment `5634195861`), on exactly the grounds
      # `test_dependency_direction.py` joined under § 4.1. Both are SHAPE
      # assertions authored HERE: the guard PARSES `gate_console.py` and
      # `generator.py` with `ast` and never imports them, and the profile suite
      # imports `openxdox.domain_profile` alone — `yaml` and the standard
      # library, no `doc_health`, no carved module. So they do NOT un-narrow
      # RULED Q-L8 (b'): the carved suites stay out until the BUILD arc makes
      # them runnable.
      #
      # The guard is the reason § 4.4 is a fix rather than a cleanup. "A
      # hardcoded status word is a defect under `domain-mapping-declaration`"
      # (tasks.md § 4.4), and the literals it removes were the OBVIOUS way to
      # write the code when the engine and its one domain lived in the same
      # repository — they will be the obvious way again the next time someone
      # adds a status-bearing step. A defect class that recurs by default needs
      # a required check, not a commit message.
      # `split-opendox-two-layer-product` § 3.4 SLICE S5 adds
      # `tests/test_gate_loop_views.py` on exactly the footing its four
      # neighbours stand on. S5 is "contribute the gate loop" (openDox-spec
      # `docs/front-end-package-boundary.md` § 5 row S5 @ `7d12428c`), and this
      # leg's half of it is the six class-B modules arriving as PACKAGE DATA,
      # the six `ViewBinding` specs that declare them, the assembly hook that
      # places the bytes into openDox's one `--web-dir` and the hosted GET
      # fallback — RULED Q1-Q12 (openxFactory#656 comments 5648044785 /
      # 5648049748 / 5648065587, Brett Heap, 2026-09-12).
      #
      # It is the only place this column's contract is EXECUTED rather than
      # described: that every declared export is really exported, that every
      # entry takes the one RULED mount signature, that the dispose binding's
      # four computed verbs are literals now, that the hosted fallback claims
      # six EXACT paths and never a `/views/` prefix that would intercept
      # openDox's own modules, and that this column's reach into openDox's
      # bundle is exactly what it declares.
      #
      # `--noconftest` safe and needs no consumer: it imports this package's own
      # modules and reads this package's own files as text. Its three
      # materialization assertions used to SKIP — never fail — because the
      # pinned `opendox` predated the view contract, "which is this leg's state
      # until the pin bump that lands with the openDox half". THAT BUMP HAS
      # LANDED: `pyproject.toml` names `0b4e8bbf` (openDox-code#23, § 3.4 slice
      # S8 leg B) since 2026-09-16, and this file goes 32 passed / 3 skipped ->
      # 35 passed / 0 skipped under the invocation below.
      #
      # `tests/test_gate_loop_probes.py` joins it on the same footing and for
      # the reason the slice exists: slice S4 proved its two new modules by
      # DRIVING them under node, and those modules are this package's data now,
      # so the five probes came with them (openDox-code#20 drops them from
      # `tests/test_split_route_tails.py` in the same slice). Deleting
      # behavioural coverage in a refactor is how a move that passes every shape
      # assertion silently breaks a verb. Each probe assembles a COMPOSED bundle
      # — openDox's own `web/` with this column's six modules placed into it by
      # `web_assets.install_view_modules()`, RULED Q5's own hook — so what is
      # measured is the shipped byte in the shipped position. This block used to
      # end "where the installed `opendox` carries no bundle (this leg's pinned
      # state until the pin bump) every probe SKIPS". THE SAME BUMP CLEARED IT:
      # at `0b4e8bbf` the bundle is in the wheel and this file goes 0 passed /
      # 13 skipped -> 13 passed / 0 skipped. The skip survives for an assembly
      # that installs a DIFFERENT openDox from the one this leg declares — the
      # guard compares two commit identities and never asks git which came first,
      # so "different" is all it can say — and the `node` one for a runner
      # without node.
      # § 3.4 SLICE S8 UN-NARROWS THIS LIST AS FAR AS THE MEASUREMENT ALLOWS,
      # which is the half of RULED Q-L8 (b′) this slice was scoped to lift.
      # The note's § 5 S8 row says the narrowings "lift FOR THE WEB SUITES", and
      # § 1.2(d) is why: 23 carved suites at THIS leg name a `views/<name>.js`
      # path and resolve it under `REPO_ROOT / "src" / "openxdox" / "web"` — a
      # directory this leg does not have — so "nothing runs them" here. S8
      # re-points 46 sites across 31 files at the PINNED openDox bundle
      # (`tests/opendox_bundle.py`, slice S5's own `_opendox_bundle()` shape) and
      # repairs three PRE-CARVE `scripts/ideation_dashboard/<module>.py` reads.
      # NINE SUITES JOIN THE SIX: 154 passed / 16 skipped becomes 301 passed /
      # 23 skipped, measured file-by-file under this exact invocation before
      # each was named (openXdox-code `build/s8-shed-web-tests`, 2026-09-13,
      # python 3.12.3 / pytest 8.4.2):
      #
      #   tests/test_doxbench_abstract_store.py        1 failed  -> 35 passed
      #   tests/test_doxbench_telemetry.py             1 failed  -> 18 passed
      #       both a pre-carve `MODULE_PATH`; the module under test is
      #       openDox's and is read through the PIN, as the bundle now is.
      #   tests/test_doxbench_mutation_boundary.py   1 error     ->  1 skipped
      #       A WEB SUITE, and the one of the 23 S8 could name: it reads bundle
      #       files, so with the path repaired it COLLECTED and skipped on the
      #       stated reason (this leg's `opendox` pin predated openDox's
      #       `web/**` package-data declaration) instead of erroring on a
      #       directory that does not exist. That it collects at all is
      #       § 1.2(d)'s defect closed. S8 then predicted "the pin bump is what
      #       makes it run". THE PIN BUMP MEASURED IT AND THE PREDICTION WAS
      #       WRONG — the block below says what actually happens, and the file
      #       LEAVES this list in the same act that moved the pin.
      #   tests/test_evidence_provenance_surface.py         19 passed
      #   tests/test_evidence_provenance_surface_seam.py     8 passed 2 skipped
      #   tests/test_model_scenario_workbench.py            23 passed
      #   tests/test_model_scenario_workbench_seam.py       10 passed 2 skipped
      #   tests/test_role_authority_projection.py           28 passed
      #   tests/test_role_authority_projection_seam.py       6 passed 2 skipped
      #       carved suites that were already green under this invocation and
      #       had no reason left to sit outside the required check.
      #
      # WHAT THIS LIST STILL IS NOT: `python -m pytest -q` over the tree, and
      # the blocker is measured rather than asserted. THIRTY-SEVEN of this
      # leg's 88 test files fail COLLECTION on one of two openxFactory-only
      # packages present at neither leg — 21 on `ideation_dashboard`, 16 on
      # `doc_health`, the latter reached from `src/openxdox/generator.py:66`'s
      # `from doc_health import corpus` — and past collection the same two
      # reappear inside the PINNED openDox (`opendox/doxbench_packet.py:177`,
      # `import ideation_dashboard.doxbench_status_exemption`). That is the
      # BUILD arc's (split-opendox § 3.5/3.6), which RULED Q-L8 (b′)'s own
      # sentence at the head of this block names as what the rest of the
      # narrowing waits on. `tests/test_doxbench_turns.py` is the file that
      # shows it cleanly: S8's repairs take it from 37 failed / 146 passed to
      # 202 passed / 32 failed / 3 skipped, and every one of the 32 is that
      # single import. It is NOT named below, because naming it would put the
      # required check red for the BUILD arc's defect.
      #
      # `tests/test_aggregation_register_instance.py` is green and also not
      # named: it is all-skip today, on the same footing openDox-code#23 left
      # its two all-skip suites off ITS list.
      #
      # ONE FILE LEAVES THIS LIST WITH THE 2026-09-16 PIN BUMP
      # (`a99eba03` -> `0b4e8bbf`), and the reason is the BUILD arc's, not the
      # bump's. RULED openxFactory#656 comment 5700475319 (Brett Heap,
      # 2026-09-16, by interactive multi-choice): the question "drop it, keep it
      # and accept a red required check, or edit the arrived file" was put to
      # Brett Heap and answered (a) DROP IT, "with the measurement and both
      # grounds in the workflow comment; it returns with the BUILD arc beside
      # test_doxbench_turns.py" — which is what follows.
      #
      # `tests/test_doxbench_mutation_boundary.py` was named by S8 on
      # the measurement quoted above: it COLLECTS, then skips whole at
      # `tests/opendox_bundle.py`'s module-level skip, which is what happened
      # while the pinned `opendox` carried no `web/` bundle. At `0b4e8bbf` the
      # bundle IS in the wheel, so the module-level skip on its line 46 no
      # longer fires and the module runs on to its line 481 `from openxdox
      # import gate_console` -> `src/openxdox/gate_console.py:63  from
      # doc_health import corpus`, the openxFactory-only package named two
      # paragraphs up. Measured under this exact invocation, in a fresh venv at
      # the new pin: `ERROR tests/test_doxbench_mutation_boundary.py …
      # ModuleNotFoundError: No module named 'doc_health'`, a COLLECTION error
      # that interrupts the whole run.
      #
      # It is DROPPED rather than repaired, for the reason
      # `tests/test_doxbench_turns.py` is not named at all: naming it would put
      # the required check red for the BUILD arc's defect (split-opendox
      # § 3.5/3.6, RULED Q-L8 (b′)), and the file is an ARRIVED carve row whose
      # edits are declared at openxFactory — deferring its `gate_console` import
      # would be an undeclared edit to a declared surface. It comes back to this
      # list with the BUILD arc, in the act that makes `doc_health` reachable,
      # alongside `test_doxbench_turns.py`.
      #
      # WITH IT GONE AND THE PIN MOVED, this invocation goes 301 passed /
      # 23 skipped -> 348 passed / 6 skipped, and BOTH HALVES OF THAT DELTA HAVE
      # TO BE SAID SEPARATELY, because Copilot's round-3 review of #21 caught this
      # block conflating them:
      #
      #   * SIXTEEN skips became PASSES — the 3 materialization assertions in
      #     `tests/test_gate_loop_views.py` and the 13 node probes in
      #     `tests/test_gate_loop_probes.py`. That is the pin bump's own effect,
      #     and it is the whole point of the act.
      #   * The seventeenth skip did NOT clear. It was
      #     `tests/test_doxbench_mutation_boundary.py`'s module-level skip, and at
      #     the new pin it becomes a COLLECTION ERROR (see the block above); the
      #     file leaves this list, so that skip is no longer RUN rather than
      #     cleared. Counting it as cleared would describe a transition that never
      #     happened.
      #   * The remaining rise to 348 is NOT the bump: it is the 31 direct tests
      #     of the provenance guard that Copilot's review rounds asked for, which
      #     live in `tests/test_gate_loop_probes.py` and
      #     `tests/test_gate_loop_views.py` and are therefore both on this list.
      #     The bump alone measured 317. Both counts are re-derived at every head
      #     rather than carried:
      #       git diff main -- tests/test_gate_loop_probes.py \
      #                        tests/test_gate_loop_views.py | grep -c '^+def test_'
      #     gives 31, and the passing figure has run 317 -> 323 -> 330 -> 332 ->
      #     333 -> 334 -> 336 -> 343 -> 346 -> 348, once per round that added tests
      #     — the
      #     same discipline the block above applies to the skip counts. The review
      #     of `8b23f6f` asked for the CALL SITES: the tests before it proved what
      #     the guard decides and what it reads, and none of them proved that the
      #     three callers still route a missing subject into it, so swapping any
      #     one call for a bare `pytest.skip` would have left every required test
      #     green. The review of `24cd5f2` took the last three: the CI branch's
      #     message had to name WHICH side it could not read (two cases — an
      #     unreadable `pyproject.toml` beside a good `direct_url.json`, and
      #     neither side readable), and `_view_extension_or_skip()` had to survive
      #     a `view_extension` module that carries no `ViewBinding` class, which
      #     until then left this guard through an `AttributeError`. The review of
      #     `cb84001` took the two after that: BOTH new caller branches had only
      #     their declared-pin FAIL driven, so making either an unconditional
      #     failure would have passed every added test while breaking the consumer
      #     RULED 5700475319 protects — the assembly that pins an openDox behind
      #     the view contract. Each is now driven at a DIFFERENT commit too.)
      #
      # The 6 skips that remain are the three seam suites' `doc_health` pairs,
      # which no pin bump touches.
      #
      # `--noconftest` STAYS, and it is why this list is a list: `tests/
      # conftest.py` imports the carved session fixtures, which reach both
      # absent packages. Every file named here stands on its own under it.
      - name: pytest
        run: >-
          python -m pytest -q
          tests/test_leg_shape.py
          tests/test_dependency_direction.py
          tests/test_domain_profile.py
          tests/test_no_hardcoded_status_words.py
          tests/test_gate_loop_views.py
          tests/test_gate_loop_probes.py
          tests/test_doxbench_abstract_store.py
          tests/test_doxbench_telemetry.py
          tests/test_evidence_provenance_surface.py
          tests/test_evidence_provenance_surface_seam.py
          tests/test_model_scenario_workbench.py
          tests/test_model_scenario_workbench_seam.py
          tests/test_role_authority_projection.py
          tests/test_role_authority_projection_seam.py
          --noconftest
