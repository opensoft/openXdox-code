name: validate

# The required check for this leg: parity with the assembly root's own
# `validate` gate (same name, same triggers) — a pytest suite proving the leg
# shape.

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install pytest
        run: python -m pip install pytest

      - name: pytest
        run: python -m pytest -q
