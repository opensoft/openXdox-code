# SonarCloud automatic analysis settings for openXdox-code (plan 034 T061).
#
# THE PACKAGED VALIDATOR IS ANALYSED ONCE, AT scripts/. Since T061 the package
# ships src/openxdox/contracts/validate-ideation-dashboard-contracts.py as
# package data, so that an install runs its own validator (#1144 7.3). It is a
# byte copy of scripts/validate-ideation-dashboard-contracts.py, which a source
# checkout runs and which is analysed here as every other file is.
# tests/test_packaged_validator.py holds the two byte-equal, so no line can
# differ unseen. Analysing the copy as well would count each of the validator's
# lines, and each finding, twice.
sonar.exclusions=src/openxdox/contracts/validate-ideation-dashboard-contracts.py
