# THE DECLARED EXCLUSION: the test files this leg's whole suite runs without,
# each with its reason, and their count (plan 034 task T041, in openxFactory
# `specs/034-opendox-standalone-operation/`; requirement 9, first scenario).
#
# WHAT IT IS. Each file below reaches something that only openxFactory
# carries, so a lone openXdox-code checkout cannot run it. Requirement 9 asks
# for the whole suite, green, in the leg's own checkout. A check that runs less
# than that declares what it leaves out, with the count and the reason, and
# reports it as an OPEN extraction (FR-006). This file is that declaration.
# Nothing in it is closed. Each entry stays open until its reason is cleared,
# and requirement 9 is met for this leg only once the list is empty.
#
# WHO READS IT.
#   * The repository-root `conftest.py`. It derives `collect_ignore` from
#     `entries`, so a run that loads it collects the whole suite less these
#     files, with no second list to keep. At the end of that run it prints the
#     exclusion as an open extraction: the count, each reason, and each file
#     with its reasons. It refuses to load a declaration that breaks a rule
#     below, so a malformed one stops the run rather than excluding the wrong
#     set.
#   * `tests/test_declared_exclusion.py`. It holds each file to its entry: the
#     file, run ALONE, must fail, and every red result it shows must be caused
#     by one of the reasons its entry names, each of them at least once. So the
#     list cannot hide a failure of any other kind. A file that stops failing
#     for its reason turns that test red, and it leaves the list in the pull
#     request that clears the reason.
#
# THE RULES.
#   * `schema_version` is the integer 1, and `count` is an integer equal to the
#     number of `entries`. No mapping gives a key twice, since YAML would keep
#     only the last.
#   * Each entry names an existing `tests/test_*.py` file, written plainly
#     (`tests/<name>`), once, in path order, and one or more of the declared
#     `reasons` by id. An optional `note` says why an entry is unusual. No
#     other key is read, so none is allowed. `tests/test_declared_exclusion.py`
#     is never an entry, since it is the check that holds this file.
#   * `reasons` are drawn from the four the rulings admit, and no other, and
#     each one's `ruled` starts with the ruling that admits it. A fifth needs
#     a ruling first. An id is one lowercase token, and each reason's texts,
#     like each note, are one line. Every declared reason is named by at least
#     one entry, and `only` lists exactly the files that name its reason, each
#     once.
#   * An entry leaves in the pull request that clears its reason, and the count
#     moves with it. A reason leaves with its last entry.
#
# HOW IT IS WRITTEN. From a run of each file alone at the openDox this leg
# pins, not from a list. The pull request that changes an entry quotes that
# run. Where a reason's cause changes shape, for example a new refusal message,
# `tests/test_declared_exclusion.py`'s evidence for that reason changes with
# it, in the same pull request.

