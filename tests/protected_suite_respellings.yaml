# THE REVIEWED ALLOW-LIST: every edit an arc landing makes to a protected
# suite, each entered with its reason (plan 034, in openxFactory
# `specs/034-opendox-standalone-operation/`).
#
# WHAT IT IS. #1144 (openxFactory `openspec/changes/
# add-neutral-product-standalone-operability/`) protects two sets of this
# leg's suites from the arc that realizes it:
#   * 5.4a's falsifier (F5.2) protects the governed projection's own proofs,
#     taken by glob: `tests/test_generator.py`, `tests/test_snapshot*.py` and
#     `tests/test_session_snapshot.py`;
#   * 12.5's falsifier protects the governed flow's proofs, computed: every
#     `tests/test_*.py` that names `open-pr`, `open_pr` or `FakePullRequests`.
# Each falsifier finds the arc's landings by their `Arc:` trailer, and it
# refuses any landing that touches one of those paths. T007's batch C amends
# both (RULED R1Q7 (a), openxFactory#656 comment `5817152735`). The check
# subtracts the edits entered here, and only those, so an edit to a protected
# suite is lawful only as an entry in this file, and only where a ruling
# admits it. The name is the one batch C gives the file.
#
# WHAT A RULING ADMITS. Nothing else is entered.
#   * A RESPELLING of a reference to a seam the arc moved, with no assertion
#     weakened (R1Q7 (a), batch C).
#   * The two edits F7.1 requires (R1Q14 (a), `5850003126`, batch F), in
#     `tests/test_snapshot.py` and `tests/test_snapshot_validator_home.py`.
#   * The two edits 5.3a's `values` block requires (R1Q26 (a), `5851950767`,
#     batch I), in `tests/test_gate_loop_views.py`.
#   * The ten cases 7.3's lookup rewords (Brett's ruling at `5916000030`, batch
#     K), nine in `tests/test_snapshot_validation_launch.py` and one in
#     `tests/test_snapshot.py`: each one's walk premise becomes 7.3's answer,
#     and its assertions stay.
# The last three kinds are each entered with a reason, and none is entered as
# a respelling.
#
# WHO WRITES IT. The task that makes the first admitted edit creates it, in its
# own pull request (plan 034 T019's rule). T067 amended that rule: T060
# creates it if T043 has not, and T043 did not. So the file begins with T060's
# entry. Each later admitted edit appends its own entry in the pull request
# that makes the edit.
#
# WHO READS IT. `scripts/protected_suites.py`, since plan 034 T059 (batch C's
# wiring). It is the last step of F5.2 and of 12.5's falsifier, in place of the
# inline intersection each ended with: the falsifier still lists the landings
# and the protected suites itself, and the script subtracts the entries that
# hold. Its docstring gives both calls. Until T059 nothing read this file, and
# both falsifiers refused every protected path an arc landing touched.
#
# THE RULES.
#   * `schema_version` is the integer 1, and `kind` is
#     `protected-suite-respellings`. No mapping gives a key twice.
#   * `entries` are in landing order, one per edit. Each entry names:
#     - `suite`, the protected file, written plainly (`tests/<name>`);
#     - `test`, the one test the edit changes;
#     - `landing`, the pull request that lands the edit,
#       `opensoft/openXdox-code#<n>`, because the landing's commit is not
#       known inside it (T019's rule);
#     - `edit`, which is `respelling` or `admitted`. A respelling also names
#       `respelled`, the reference it respells, from what to what. An admitted
#       edit also names `reason`;
#     - `ruled`, the ruling that admits the edit and the #1144 amendment that
#       records it;
#     - `review`, the basis the landing pull request is reviewed on;
#     - `before_blob` and `after_blob`, the git blob ids of `suite` just
#       before and just after the edit;
#     - `old` and `new`, the exact text the edit replaces and the text it
#       leaves, whole lines, each ending in a newline.
#   * AN ENTRY HOLDS when its landing L satisfies three conditions:
#     `git rev-parse L^1:<suite>` is `before_blob`; `git rev-parse L:<suite>`
#     is `after_blob`; and replacing `old`, which occurs exactly once in the
#     `before_blob` text, with `new` gives the `after_blob` text byte for byte.
#     A landing whose diff for a protected path matches no entry is refused,
#     exactly as an unentered edit is (batch C). The check T059 wired holds a
#     fourth, from `test`: `old` lies inside the named test in the
#     `before_blob` text, and `new` inside it in the `after_blob` text, so an
#     entry cannot admit an edit to another test of the suite.
#   * AN ADDED TEST (plan 034 T061; batch F admits one). Where `test` does not
#     exist in the `before_blob` text, the fourth condition reads instead: `new`
#     is `old` followed by that test's whole definition and blank lines, and
#     nothing else. `old` is then the text the test is added after.
#   * Entries for one suite CHAIN: each one's `before_blob` is the previous
#     one's `after_blob`, because each edit is made to the suite the last one
#     left.
#   * SEVERAL EDITS IN ONE LANDING (plan 034 T061; batch K), in F5.2's call
#     alone (`--chains`; 12.5's keeps one entry per suite per landing). A
#     landing that edits one suite in several tests enters each edit as its
#     own entry, in the order they apply, all naming that landing. The first
#     one's `before_blob` is the suite before the landing and the last one's
#     `after_blob` the suite at it. Each one between records, as its
#     `after_blob`, the blob id of the text its edit leaves (`git
#     hash-object`; no commit need hold it). Each holds on its own texts by the
#     conditions above, so the landing's diff for the suite is exactly their
#     texts, each inside its own test.
#   * No entry weakens an assertion. The pull request that adds an entry is
#     reviewed on exactly that basis (batch C).

